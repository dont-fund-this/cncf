[package]
name = "rata"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "rata"
path = "src/main.rs"

[dependencies]
ratatui_core = { package = "ratatui", path = "ratatui", default-features = false }
libc = "0.2"

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"

[workspace]
exclude = ["ratatui"]
